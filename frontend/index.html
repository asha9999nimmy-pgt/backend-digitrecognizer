<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MNIST Digit Recognizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #7c6af7;
    --accent2: #f76ac8;
    --accent-glow: rgba(124,106,247,0.25);
    --text: #e8e8f0;
    --muted: #7070a0;
    --success: #4ade80;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 860px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeDown 0.6s ease both;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .logo-badge span { font-size: 1rem; }

  h1 {
    font-family: var(--mono);
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 700;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.75rem;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 400;
  }

  /* API URL config */
  .api-config {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .api-config label {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .api-config input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.82rem;
  }

  .api-config input::placeholder { color: var(--muted); }

  .api-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .api-dot.live { background: var(--success); box-shadow: 0 0 8px var(--success); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 1.5rem;
    animation: fadeDown 0.6s 0.15s ease both;
  }

  .tab {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .tab.active {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .tab:hover:not(.active) { color: var(--text); }

  /* Panel */
  .panel {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .panel.active { display: block; }

  /* Canvas area */
  .canvas-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    animation: fadeDown 0.6s 0.2s ease both;
  }

  .canvas-container {
    position: relative;
    border: 2px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 40px rgba(124,106,247,0.1), inset 0 0 60px rgba(0,0,0,0.5);
    transition: border-color 0.3s;
  }

  .canvas-container:hover { border-color: var(--accent); }

  #drawCanvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  .canvas-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.08);
    font-size: 5rem;
    font-family: var(--mono);
    font-weight: 700;
    pointer-events: none;
    user-select: none;
    transition: opacity 0.3s;
  }

  .canvas-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .brush-size {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 6px 14px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .brush-size input[type=range] {
    width: 80px;
    accent-color: var(--accent);
  }

  /* Upload area */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeDown 0.6s 0.2s ease both;
  }

  .upload-area:hover, .upload-area.drag-over {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .upload-area input { display: none; }

  .upload-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: block;
  }

  .upload-area h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.4rem; }
  .upload-area p { font-size: 0.82rem; color: var(--muted); }

  .preview-img {
    margin-top: 1.5rem;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .preview-img.show { display: flex; }

  .preview-img img {
    width: 140px;
    height: 140px;
    object-fit: contain;
    border: 1px solid var(--border);
    border-radius: 12px;
    image-rendering: pixelated;
    background: #000;
  }

  .preview-img span { font-size: 0.8rem; color: var(--muted); }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 1.2rem;
  }

  .btn {
    padding: 12px 28px;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 20px rgba(124,106,247,0.4);
  }

  .btn-primary:hover { background: #9585f9; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(124,106,247,0.5); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  /* Result card */
  .result-section {
    margin-top: 2.5rem;
    animation: fadeDown 0.6s 0.25s ease both;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    display: none;
    animation: resultPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  .result-card.show { display: block; }

  .result-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.5rem;
  }

  .result-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .result-body {
    display: flex;
    align-items: center;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .digit-display {
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, var(--surface2), #0f0f20);
    border: 2px solid var(--accent);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 5rem;
    font-weight: 700;
    color: var(--accent);
    box-shadow: 0 0 40px rgba(124,106,247,0.2), inset 0 0 30px rgba(124,106,247,0.05);
    flex-shrink: 0;
    animation: digitReveal 0.4s ease;
    position: relative;
  }

  .digit-display::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    z-index: -1;
    opacity: 0.5;
  }

  .result-details { flex: 1; min-width: 200px; }

  .confidence-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .confidence-bar-wrap {
    background: var(--surface2);
    border-radius: 99px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 0.5rem;
  }

  .confidence-bar {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
    width: 0%;
  }

  .confidence-value {
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
  }

  .confidence-value span { font-size: 0.8rem; color: var(--muted); }

  /* Error */
  .error-box {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    color: #f87171;
    font-size: 0.85rem;
    margin-top: 1rem;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .error-box.show { display: block; }

  /* Loading spinner */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.show { display: block; }

  /* History */
  .history-section {
    margin-top: 2.5rem;
    animation: fadeDown 0.6s 0.3s ease both;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .history-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .history-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: chipPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .history-chip .h-digit {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
  }

  .history-chip .h-conf { color: var(--muted); font-size: 0.7rem; }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  @keyframes resultPop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes digitReveal {
    from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes chipPop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 500px) {
    .result-body { justify-content: center; text-align: center; }
    .result-details { min-width: unset; width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <header>
    <div class="logo-badge"><span>🔢</span> Neural Network · MNIST</div>
    <h1>Digit Recognizer</h1>
    <p class="subtitle">Draw a digit or upload an image — the model will predict it instantly</p>
  </header>

  <!-- API Config -->
  <div class="api-config">
    <div class="api-dot" id="apiDot"></div>
    <label>API_URL</label>
    <input type="text" id="apiUrl" value="https://backend-digitrecognizer-2.onrender.com" />
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('draw', this)">
      ✏️ Draw
    </button>
    <button class="tab" onclick="switchTab('upload', this)">
      📁 Upload Image
    </button>
  </div>

  <!-- Draw Panel -->
  <div class="panel active" id="panel-draw">
    <div class="canvas-wrapper">
      <div class="canvas-container">
        <canvas id="drawCanvas" width="280" height="280"></canvas>
        <div class="canvas-hint" id="canvasHint">?</div>
      </div>
      <div class="canvas-controls">
        <div class="brush-size">
          🖌 Brush
          <input type="range" id="brushSize" min="8" max="28" value="16" />
          <span id="brushLabel">16</span>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="clearCanvas()">🗑 Clear</button>
        <button class="btn btn-primary" id="predictDrawBtn" onclick="predictFromCanvas()">
          <div class="spinner" id="drawSpinner"></div>
          <span id="drawBtnText">✨ Predict</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Upload Panel -->
  <div class="panel" id="panel-upload">
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(this)" />
      <span class="upload-icon">📷</span>
      <h3>Drop or click to upload</h3>
      <p>PNG, JPG, GIF · Any size · Will be scaled to 28×28</p>
      <div class="preview-img" id="previewImg">
        <img id="previewSrc" src="" alt="Preview" />
        <span id="previewName"></span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="clearUpload()">🗑 Clear</button>
      <button class="btn btn-primary" id="predictUploadBtn" onclick="predictFromUpload()">
        <div class="spinner" id="uploadSpinner"></div>
        <span id="uploadBtnText">✨ Predict</span>
      </button>
    </div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Result -->
  <div class="result-section">
    <div class="result-card" id="resultCard">
      <div class="result-header">
        <div class="result-label">Prediction Result</div>
      </div>
      <div class="result-body">
        <div class="digit-display" id="digitDisplay">–</div>
        <div class="result-details">
          <div class="confidence-label">Model Confidence</div>
          <div class="confidence-bar-wrap">
            <div class="confidence-bar" id="confBar"></div>
          </div>
          <div class="confidence-value" id="confValue">–<span> %</span></div>
          <div style="margin-top:1rem;font-size:0.82rem;color:var(--muted)">
            Predicted Digit: <strong id="predWord" style="color:var(--text)">–</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="history-section" id="historySection" style="display:none">
    <div class="section-title">Recent Predictions</div>
    <div class="history-grid" id="historyGrid"></div>
  </div>

</div>

<script>
  // ---- State ----
  let currentTab = 'draw';
  let uploadedImageData = null;
  const history = [];

  // ---- Canvas Setup ----
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 280, 280);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';

  let drawing = false;
  let hasDrawn = false;

  const brushInput = document.getElementById('brushSize');
  const brushLabel = document.getElementById('brushLabel');
  brushInput.addEventListener('input', () => {
    brushLabel.textContent = brushInput.value;
    ctx.lineWidth = parseInt(brushInput.value);
  });
  ctx.lineWidth = 16;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  canvas.addEventListener('mousedown', e => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    if (!hasDrawn) { hasDrawn = true; document.getElementById('canvasHint').style.opacity = '0'; }
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  });
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseleave', () => drawing = false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!drawing) return;
    if (!hasDrawn) { hasDrawn = true; document.getElementById('canvasHint').style.opacity = '0'; }
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  });
  canvas.addEventListener('touchend', () => drawing = false);

  function clearCanvas() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 280, 280);
    hasDrawn = false;
    document.getElementById('canvasHint').style.opacity = '';
    hideResult();
  }

  // ---- Tabs ----
  function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    hideResult();
    hideError();
  }

  // ---- Upload ----
  const uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) processUploadedFile(file);
  });

  function handleFileUpload(input) {
    if (input.files[0]) processUploadedFile(input.files[0]);
  }

  function processUploadedFile(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.getElementById('previewSrc');
      img.src = ev.target.result;
      document.getElementById('previewName').textContent = file.name;
      document.getElementById('previewImg').classList.add('show');

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 28; tempCanvas.height = 28;
      const tctx = tempCanvas.getContext('2d');
      const image = new Image();
      image.onload = () => {
        tctx.fillStyle = '#000';
        tctx.fillRect(0, 0, 28, 28);
        tctx.drawImage(image, 0, 0, 28, 28);
        const imageData = tctx.getImageData(0, 0, 28, 28);
        const pixels = [];
        for (let i = 0; i < 28 * 28; i++) {
          const r = imageData.data[i * 4];
          const g = imageData.data[i * 4 + 1];
          const b = imageData.data[i * 4 + 2];
          const gray = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
          pixels.push(gray);
        }
        uploadedImageData = pixels;
      };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearUpload() {
    uploadedImageData = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('previewImg').classList.remove('show');
    document.getElementById('previewSrc').src = '';
    hideResult();
  }

  // ---- Predict ----
  function getApiUrl() {
    const val = document.getElementById('apiUrl').value.trim().replace(/\/$/, '');
    return val ? val + '/predict' : null;
  }

  function canvasToPixels() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 28; tempCanvas.height = 28;
    const tctx = tempCanvas.getContext('2d');
    tctx.drawImage(canvas, 0, 0, 28, 28);
    const imageData = tctx.getImageData(0, 0, 28, 28);
    const pixels = [];
    for (let i = 0; i < 28 * 28; i++) {
      const r = imageData.data[i * 4];
      const g = imageData.data[i * 4 + 1];
      const b = imageData.data[i * 4 + 2];
      const gray = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      pixels.push(gray);
    }
    return pixels;
  }

  async function sendPrediction(pixels) {
    const url = getApiUrl();
    if (!url) { showError('Please enter your Render API URL above.'); return; }

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: pixels })
    });

    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`API error ${res.status}: ${txt}`);
    }
    return await res.json();
  }

  async function predictFromCanvas() {
    if (!hasDrawn) { showError('Please draw a digit on the canvas first.'); return; }
    setLoading('draw', true);
    hideError();
    try {
      const pixels = canvasToPixels();
      const result = await sendPrediction(pixels);
      showResult(result);
    } catch (e) {
      showError(e.message);
    } finally {
      setLoading('draw', false);
    }
  }

  async function predictFromUpload() {
    if (!uploadedImageData) { showError('Please upload an image first.'); return; }
    setLoading('upload', true);
    hideError();
    try {
      const result = await sendPrediction(uploadedImageData);
      showResult(result);
    } catch (e) {
      showError(e.message);
    } finally {
      setLoading('upload', false);
    }
  }

  function setLoading(mode, state) {
    const spinner = document.getElementById(mode + 'Spinner');
    const btnText = document.getElementById(mode + 'BtnText');
    const btn = document.getElementById('predict' + mode.charAt(0).toUpperCase() + mode.slice(1) + 'Btn');
    spinner.classList.toggle('show', state);
    btnText.textContent = state ? 'Predicting…' : '✨ Predict';
    btn.disabled = state;
  }

  // ---- Result ----
  const DIGIT_NAMES = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine'];

  function showResult(data) {
    const digit = data.prediction;
    const conf = Math.round(data.confidence * 100);

    const card = document.getElementById('resultCard');
    card.classList.remove('show');
    void card.offsetWidth;
    card.classList.add('show');

    // Trigger re-animation
    const disp = document.getElementById('digitDisplay');
    disp.style.animation = 'none';
    void disp.offsetWidth;
    disp.style.animation = '';

    document.getElementById('digitDisplay').textContent = digit;
    document.getElementById('confValue').innerHTML = conf + '<span> %</span>';
    document.getElementById('predWord').textContent = DIGIT_NAMES[parseInt(digit)] || digit;

    setTimeout(() => {
      document.getElementById('confBar').style.width = conf + '%';
    }, 50);

    document.getElementById('apiDot').classList.add('live');

    addHistory(digit, conf);
  }

  function hideResult() {
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('confBar').style.width = '0%';
  }

  function addHistory(digit, conf) {
    history.unshift({ digit, conf });
    if (history.length > 10) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const grid = document.getElementById('historyGrid');
    section.style.display = 'block';
    grid.innerHTML = history.map(h =>
      `<div class="history-chip">
        <span class="h-digit">${h.digit}</span>
        <span class="h-conf">${h.conf}%</span>
      </div>`
    ).join('');
  }

  // ---- Error ----
  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = '⚠️ ' + msg;
    box.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorBox').classList.remove('show');
  }
</script>
</body>
</html>
